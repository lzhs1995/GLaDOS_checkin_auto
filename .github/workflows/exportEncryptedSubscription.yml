name: Export encrypted GLaDOS subscription

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch private subscription
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.request

          cookie = os.environ.get("GLADOS_COOKIE", "").split("&", 1)[0]
          if not cookie:
              raise SystemExit("GLADOS_COOKIE is missing")

          headers = {
              "Cookie": cookie,
              "Origin": "https://glados.rocks",
              "Referer": "https://glados.rocks/console/subscription",
              "User-Agent": "Mozilla/5.0",
          }
          request = urllib.request.Request(
              "https://glados.rocks/api/user/status", headers=headers
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              raw = response.read()
          payload = json.loads(raw)
          data = payload.get("data") or {}
          required = ("configureId", "code", "port")
          if not all(data.get(field) not in (None, "") for field in required):
              raise SystemExit("GLaDOS status did not contain subscription coordinates")

          config = None
          for host in ("update.glados-config.com", "www.glados-config.com"):
              subscription = (
                  f"https://{host}/mihomo/"
                  f"{data['configureId']}/{data['code']}/{data['port']}/glados.yaml"
              )
              try:
                  config_request = urllib.request.Request(
                      subscription, headers={"User-Agent": "Mozilla/5.0"}
                  )
                  with urllib.request.urlopen(config_request, timeout=30) as response:
                      candidate = response.read()
              except (OSError, urllib.error.URLError):
                  continue
              if b"proxies:" in candidate and b"US-Dedicated-B1-1" in candidate:
                  config = candidate.decode("utf-8")
                  break

          export = {
              "schema_version": 1,
              "status": payload,
              "mihomo_config": config,
          }
          encoded = json.dumps(export, separators=(",", ":")).encode()
          pathlib.Path("/tmp/glados-export.json").write_bytes(encoded)
          print(
              "Authenticated export accepted "
              f"(subscription_available={config is not None}, encrypted bytes pending)"
          )
          PY

      - name: Encrypt response for local operator
        run: |
          umask 077
          openssl rand -out /tmp/keyiv.bin 48
          key_hex="$(head -c 32 /tmp/keyiv.bin | xxd -p -c 256)"
          iv_hex="$(tail -c 16 /tmp/keyiv.bin | xxd -p -c 256)"
          openssl enc -aes-256-cbc \
            -K "$key_hex" -iv "$iv_hex" \
            -in /tmp/glados-export.json \
            -out /tmp/glados-export.enc
          openssl pkeyutl -encrypt \
            -pubin \
            -inkey scripts/subscription-export-public.pem \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -in /tmp/keyiv.bin \
            -out /tmp/keyiv.enc
          cd /tmp
          sha256sum glados-export.enc keyiv.enc > SHA256SUMS

      - name: Upload ciphertext only
        uses: actions/upload-artifact@v4
        with:
          name: glados-subscription-encrypted
          path: |
            /tmp/glados-export.enc
            /tmp/keyiv.enc
            /tmp/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
